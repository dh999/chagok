name: chagok
description: "차곡 - AI와 함께 목표를 이루는 습관 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.4

  # Routing
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  cloud_functions: ^4.6.8
  firebase_messaging: ^14.7.19

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0

  # UI & Animation
  flutter_animate: ^4.5.0
  rive: ^0.12.4
  table_calendar: ^3.0.9

  # Utils
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  vibration: ^1.8.4
  audioplayers: ^5.2.1
  intl: ^0.19.0
  uuid: ^4.3.3

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11

flutter:
  uses-material-design: true

  assets:
    - assets/images/houses/
    - assets/images/rabbit/
    - assets/images/blocks/
    - assets/images/items/
    - assets/sounds/
    - assets/animations/

  fonts:
    - family: PixelFont
      fonts:
        - asset: assets/fonts/DungGeunMo.ttf
